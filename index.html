<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday!</title>
  <style>
    body {
      background-color: #3e2723; /* Dark Brown Background */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    h1 {
      color: #ffe0b2;
      margin-bottom: 40px;
    }

    /* Cake Styling */
    .cake {
      position: relative;
      width: 150px;
      height: 100px;
      background: #8b4513;
      border-radius: 10px 10px 0 0;
      box-shadow: inset 0 12px 0 #fff8dc;
    }

    /* Candle Styling */
    .candle {
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      width: 12px;
      height: 30px;
      background: repeating-linear-gradient(45deg, #ff69b4, #ff69b4 5px, #fff 5px, #fff 10px);
      border-radius: 3px;
    }

    /* Flame Styling */
    .flame {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      width: 12px;
      height: 18px;
      background: #ff8c00;
      border-radius: 50% 50% 20% 20%;
      box-shadow: 0 0 10px #ffd700;
      animation: flicker 0.2s infinite alternate;
      transition: opacity 0.5s ease;
    }

    .flame.out {
      opacity: 0;
      animation: none;
    }

    @keyframes flicker {
      0% { transform: translateX(-50%) scale(1); }
      100% { transform: translateX(-50%) scale(1.1); }
    }

    button {
      margin-top: 50px;
      padding: 12px 24px;
      font-size: 16px;
      background-color: #ff69b4;
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
    }

    button:hover {
      background-color: #ff1493;
    }
  </style>
</head>
<body>

  <h1>Make a Wish!</h1>

  <div class="cake">
    <div class="candle">
      <div class="flame" id="flame"></div>
    </div>
  </div>

  <button id="startBtn">Enable Microphone</button>

  <script>
    const startBtn = document.getElementById('startBtn');
    const flame = document.getElementById('flame');

    startBtn.addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        startBtn.style.display = 'none';

        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const analyser = audioContext.createAnalyser();
        const microphone = audioContext.createMediaStreamSource(stream);
        microphone.connect(analyser);

        analyser.fftSize = 256;
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);

        function checkVolume() {
          analyser.getByteFrequencyData(dataArray);
          
          let sum = 0;
          for (let i = 0; i < bufferLength; i++) {
            sum += dataArray[i];
          }
          let average = sum / bufferLength;

          if (average > 45) {
            flame.classList.add('out');
          } else {
            requestAnimationFrame(checkVolume);
          }
        }

        checkVolume();

      } catch (err) {
        alert('Microphone access is required to blow out the candle.');
        console.error(err);
      }
    });
  </script>
</body>
</html>
